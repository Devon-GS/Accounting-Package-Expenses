{% extends "base.html" %}

{% block content %}
<section class="login-shell">
  <div class="card login-card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <p class="eyebrow text-dark mb-2">Secure access</p>
        <h1 class="h3 mb-2">{{ app_name }} Accounting</h1>
        <p class="text-muted mb-0">Log in to continue.</p>
      </div>

      {% if error_message %}
        <div class="alert alert-danger" role="alert">{{ error_message }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}" novalidate>
        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
