services:
  accounting-app:
    image: ghcr.io/devon-gs/accounting-app:latest
    container_name: accounting-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${APP_SECRET_KEY}
      PORT: 5000
      APP_NAME: ${APP_NAME}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - app_instance_data:/app/instance
    networks:
      - proxy-net

volumes:
  app_instance_data:

networks:
  proxy-net:
    external: true