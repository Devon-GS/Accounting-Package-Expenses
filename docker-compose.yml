services:
  db-primary:
    image: postgres:16-alpine
    container_name: ${DOCKER_NAME}-accounting-db-primary
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT_BINDING:-5432}:5432"   # Local speedpoint recon access only
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: ${DOCKER_NAME}-accounting-image
    container_name: ${DOCKER_NAME}-accounting-system
    environment:
      DATABASE_URL: postgresql://accounting:${DB_PASSWORD}@db-primary:5432/accounting
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      FLASK_ENV: ${FLASK_ENV:-development}
      SESSION_VERSION: ${SESSION_VERSION:-1}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-8}
      PORT: 5000
      APP_NAME: ${APP_NAME}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    depends_on:
      db-primary:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - app_instance_data:/app/instance
    restart: unless-stopped

volumes:
  app_instance_data:
  postgres_primary_data:
