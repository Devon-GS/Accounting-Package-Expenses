name: Build and Push Accounting Image

on:
  push:
    branches: ["deployment"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit
          pip-audit --requirement requirements.txt
      - name: Run tests
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
          pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/devon-gs/accounting-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
